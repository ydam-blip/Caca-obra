name: Sondar CNO (teste)

on:
  workflow_dispatch:

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Listar pasta do CNO na Receita
        run: |
          for u in https://arquivos.receitafederal.gov.br/dados/cno/ https://dadosabertos.rfb.gov.br/CNO/; do
            echo "=== $u"; curl -sSL -m 60 "$u" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 3000; echo
          done
      - name: Baixar e inspecionar
        run: |
          set -x
          mkdir -p cno && cd cno
          curl -sSL -m 900 -o cno.zip https://arquivos.receitafederal.gov.br/dados/cno/cno.zip || curl -sSL -m 900 -o cno.zip https://dadosabertos.rfb.gov.br/CNO/cno.zip || true
          ls -la; file cno.zip || true
          unzip -l cno.zip || exit 0
          unzip -o -q cno.zip
          for f in *.csv; do echo "=== $f $(wc -l < "$f") linhas"; head -3 "$f" | iconv -f latin1 -t utf-8; done
          F=$(ls *.csv | grep -iv -e area -e cnae -e vinc | head -1)
          echo "=== RS em $F"; iconv -f latin1 -t utf-8 "$F" | grep -c '"RS"' || true
          echo "=== amostra Canoas"; iconv -f latin1 -t utf-8 "$F" | grep -i 'canoas' | grep '"RS"' | tail -5 || true
