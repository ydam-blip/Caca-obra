name: Testar CNO

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-cloud-bigquery
      - name: Consultar CNO (só leitura, não grava nada)
        env:
          GCP_CHAVE: ${{ secrets.GCP_CHAVE }}
        run: |
          python3 - <<'PY'
          import sys, json
          sys.path.insert(0, "coletor")
          import cno, coletar
          print("chave presente:", bool(__import__("os").environ.get("GCP_CHAVE")))
          cli, erro = cno._cliente()
          print("cliente:", "ok" if cli else erro)
          if cli:
              t = cno._colunas(cli)
              for nome, cols in t.items():
                  print("TABELA", nome, cols)
          from datetime import date
          mun = coletar.carregar_municipios()
          _, alvo = coletar.municipios_no_raio(mun, "Porto Alegre", "RS", 60)
          linhas, rel = cno.buscar(alvo)
          print("RELATORIO", json.dumps(rel, ensure_ascii=False))
          from collections import Counter
          obras = [cno.converter(r, alvo, date.today()) for r in linhas]
          obras = [o for o in obras if o]
          print("RESUMO", len(obras), Counter(o["prioridade"] for o in obras), Counter(o["categoria"] for o in obras), Counter(o["municipio"] for o in obras).most_common(8))
          for o in obras[:12]:
              print("AMOSTRA", o["nome"], "|", o["municipio"], "|", o["endereco"], "|", o["responsavel"], "|", o["fase_texto"], "|", o["prioridade"])
          PY
