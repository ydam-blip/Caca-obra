name: Testar CNO

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-cloud-bigquery
      - name: Consultar CNO (só leitura, não grava nada)
        env:
          GCP_CHAVE: ${{ secrets.GCP_CHAVE }}
        run: |
          python3 - <<'PY'
          import sys, json
          sys.path.insert(0, "coletor")
          import cno, coletar
          print("chave presente:", bool(__import__("os").environ.get("GCP_CHAVE")))
          cli, erro = cno._cliente()
          print("cliente:", "ok" if cli else erro)
          if cli:
              t = cno._colunas(cli)
              for nome, cols in t.items():
                  print("TABELA", nome, cols)
          mun = coletar.carregar_municipios()
          _, alvo = coletar.municipios_no_raio(mun, "Porto Alegre", "RS", 60)
          linhas, rel = cno.buscar(alvo)
          print("RELATORIO", json.dumps(rel, ensure_ascii=False))
          for r in linhas[:8]:
              r2 = dict(r); r2["responsavel"] = (r2.get("responsavel") or "")[:4] + "…"
              print("AMOSTRA", json.dumps(r2, ensure_ascii=False))
          PY
