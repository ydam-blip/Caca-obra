name: Atualizar obras

on:
  schedule:
    - cron: "0 9 * * 1"        # toda segunda-feira, 6h da manhã (horário de Brasília)
  workflow_dispatch:            # botão "Run workflow" para buscar na hora
    inputs:
      cidade:
        description: "Cidade (deixe vazio para usar as regiões salvas)"
        required: false
      uf:
        description: "UF (ex.: RS)"
        required: false
      raio:
        description: "Raio em km"
        required: false
        default: "60"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar leitor do CNO
        run: pip install --quiet google-cloud-bigquery
      - name: Buscar obras (PNCP + CNPJ + CNO)
        env:
          GCP_CHAVE: ${{ secrets.GCP_CHAVE }}
        run: |
          if [ -n "${{ github.event.inputs.cidade }}" ]; then
            python3 coletor/coletar.py --cidade "${{ github.event.inputs.cidade }}" --uf "${{ github.event.inputs.uf }}" --raio "${{ github.event.inputs.raio }}"
          else
            python3 coletor/coletar.py
          fi
          python3 coletor/montar_site.py
      - name: Salvar resultado
        run: |
          git config user.name "caca-obra-bot"
          git config user.email "caca-obra-bot@users.noreply.github.com"
          git add dados coletor/regioes.json index.html
          git diff --cached --quiet || git commit -m "Atualização automática de obras $(date +%F)"
          git pull --rebase -X theirs origin main || git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
